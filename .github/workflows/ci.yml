name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 타입체크
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 저장소 동작 검증
        run: npm run check:repo

      - name: 빌드
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sharktoon
    steps:
      - uses: actions/checkout@v4

      - name: 마이그레이션 적용과 RLS 검증
        run: |
          psql -c 'create database sharktoon' postgres
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_auth_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/01_ledger_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/02_series_rls_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/03_admin_test.sql
